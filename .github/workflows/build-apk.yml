name: Build MediReminder Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Add Android platform if missing
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install notification sound resource
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/raw
          cp src/main/res/raw/medication_alarm.wav android/app/src/main/res/raw/medication_alarm.wav

      - name: Configure Android permissions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
          ]
          for perm in perms:
              line = f'    <uses-permission android:name="{perm}" />'
              if line not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Read app version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check for release signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$ALIAS" ] && [ -n "$KP" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured. Building debug APK."
          fi

      - name: Decode keystore and create keystore.properties
        if: steps.signing.outputs.enabled == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          # No trailing spaces or indentation before EOF

      - name: Configure signing in build.gradle
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()

          # Add signingConfigs block if not present
          if 'signingConfigs' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  release {
                      def keystoreProperties = new Properties()
                      def keystorePropertiesFile = rootProject.file("keystore.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                      }
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }''',
                  1
              )

            # Add signingConfig only to the buildTypes release block.
            if 'signingConfig signingConfigs.release' not in s:
              marker = 'buildTypes {\n'
              release_marker = 'release {\n'
              build_types_start = s.find(marker)
              if build_types_start < 0:
                raise SystemExit('buildTypes block not found')
              release_start = s.find(release_marker, build_types_start + len(marker))
              if release_start < 0:
                raise SystemExit('buildTypes.release block not found')
              insert_at = release_start + len(release_marker)
              s = s[:insert_at] + '        signingConfig signingConfigs.release\n' + s[insert_at:]

          p.write_text(s)
          PY

      - name: Set versionCode and versionName
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="${{ steps.version.outputs.version }}"

          # Ensure defaultConfig block exists
          if ! grep -q 'defaultConfig {' android/app/build.gradle; then
            echo "defaultConfig block not found!"
            exit 1
          fi

          # Insert versionCode and versionName if missing
          if ! grep -q 'versionCode ' android/app/build.gradle; then
            sed -i '/defaultConfig {/a\        versionCode 1' android/app/build.gradle
          fi
          if ! grep -q 'versionName ' android/app/build.gradle; then
            sed -i '/defaultConfig {/a\        versionName "1.0"' android/app/build.gradle
          fi

          # Replace values
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build signed AAB
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Cleanup sensitive files
        if: steps.signing.outputs.enabled == 'true'
        run: |
          rm -f android/release.keystore android/keystore.properties

      - name: Verify and copy artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp android/app/build/outputs/bundle/release/*.aab "dist-artifacts/MediReminder-$VERSION.aab"
            cp android/app/build/outputs/apk/release/*release.apk "dist-artifacts/MediReminder-$VERSION.apk"
          else
            cp android/app/build/outputs/apk/debug/*debug.apk "dist-artifacts/MediReminder-$VERSION-debug.apk"
          fi
          ls -lh dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-Android-${{ steps.version.outputs.version }}
          path: dist-artifacts/*

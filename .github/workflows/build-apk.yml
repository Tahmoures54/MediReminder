name: Build MediReminder Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Capacitor Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
            'android.permission.SCHEDULE_EXACT_ALARM',
            'android.permission.RECEIVE_BOOT_COMPLETED',
            'android.permission.WAKE_LOCK',
          ]
          for perm in perms:
              line = f'    <uses-permission android:name="{perm}" />'
              if perm not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Require production signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$ALIAS" && test -n "$KP" || (echo 'Production signing secrets are required.' && exit 1)
          echo "$KS" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<EOF2
          storeFile=release.keystore
          storePassword=$KSP
          keyAlias=$ALIAS
          keyPassword=$KP
          EOF2

      - name: Configure signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs' not in s:
              block = '''
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
                storeFile file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            }
        }
    }
'''
              s = s.replace('android {', 'android {' + block, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace(
                  'buildTypes {\n        release {',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.release',
                  1,
              )
          p.write_text(s)
          PY

      - name: Set release version
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 31/' android/app/build.gradle || true
          sed -i 's/versionName "[^"]*"/versionName "3.1.0"/' android/app/build.gradle || true

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify artifacts
        run: |
          mkdir -p dist-artifacts
          cp android/app/build/outputs/bundle/release/*.aab dist-artifacts/MediReminder-3.1.0.aab
          cp android/app/build/outputs/apk/release/*release.apk dist-artifacts/MediReminder-3.1.0.apk
          ls -lh dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-Android-3.1.0
          path: dist-artifacts/*

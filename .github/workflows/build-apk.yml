name: Build MediReminder Android APK — Final Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate branded icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 scripts/generate_icons.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build web app — Final Release
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}

      - name: Add Android platform if missing
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure JitPack for Cafe Bazaar Poolakey
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/settings.gradle')
          s = p.read_text()
          if 'https://jitpack.io' not in s:
              start = s.find('dependencyResolutionManagement')
              if start < 0:
                  raise SystemExit('dependencyResolutionManagement block not found in android/settings.gradle')
              repo_block = s.find('repositories {', start)
              if repo_block < 0:
                  raise SystemExit('dependency repositories block not found in android/settings.gradle')
              insert_at = s.find('\\n', repo_block) + 1
              s = s[:insert_at] + "        maven { url 'https://jitpack.io' }\\n" + s[insert_at:]
              p.write_text(s)
          print('JitPack repository configured for Poolakey dependencies')
          PY

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install notification sound resource
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/raw
          cp src/main/res/raw/medication_alarm.wav android/app/src/main/res/raw/medication_alarm.wav
          ls -lh android/app/src/main/res/raw/

      - name: Install launcher icons
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          for density in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              src = Path(f'android-assets/mipmap-{density}')
              dest = Path(f'android/app/src/main/res/mipmap-{density}')
              dest.mkdir(parents=True, exist_ok=True)
              if src.is_dir():
                  for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                      f = src / name
                      if f.exists():
                          shutil.copy2(f, dest / name)

          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          anydpi = Path('android/app/src/main/res/mipmap-anydpi-v26')
          if anydpi.is_dir():
              (anydpi / 'ic_launcher.xml').write_text(adaptive.strip() + '\n')
              (anydpi / 'ic_launcher_round.xml').write_text(adaptive.strip() + '\n')

          values = Path('android/app/src/main/res/values')
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#0891b2</color>\n'
              '</resources>\n'
          )
          print('launcher icons installed')
          PY

      - name: Configure Android permissions — Final Release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.USE_FULL_SCREEN_INTENT',
          ]
          for perm in perms:
              line = f'    <uses-permission android:name="{perm}" />'
              if perm not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          if 'android:hardwareAccelerated="true"' not in s:
              s = s.replace('<application', '<application android:hardwareAccelerated="true"', 1)
          p.write_text(s)
          print('Permissions configured for final release')
          print(s[:2000])
          PY

      - name: Optimize Android build for release
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "minifyEnabled false" "$GRADLE_FILE"; then
            sed -i 's/minifyEnabled false/minifyEnabled true/' "$GRADLE_FILE"
          fi
          if grep -q "shrinkResources false" "$GRADLE_FILE"; then
            sed -i 's/shrinkResources false/shrinkResources true/' "$GRADLE_FILE"
          fi
          echo "Gradle release optimizations checked"

      - name: Read app version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent release signing
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ] || [ -z "${KSP:-}" ] || [ -z "${ALIAS:-}" ] || [ -z "${KP:-}" ]; then
            echo "::error::Persistent signing secrets are missing. Download the existing signing-key artifact, keep a secure backup, and configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets before building a release."
            exit 1
          fi
          mkdir -p android
          echo "$KS" | base64 --decode > android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KSP"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KP"
          } > android/keystore.properties
          echo "generated=false" >> "$GITHUB_OUTPUT"
          echo "Using the persistent repository release key."
      - name: Configure signing in build.gradle
        run: python3 scripts/add_signing.py

      - name: Set versionCode and versionName — Final
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="${{ steps.version.outputs.version }}"
          if ! grep -q 'versionCode ' android/app/build.gradle; then
            sed -i '/defaultConfig {/a\        versionCode 1' android/app/build.gradle
          fi
          if ! grep -q 'versionName ' android/app/build.gradle; then
            sed -i '/defaultConfig {/a\        versionName "1.0"' android/app/build.gradle
          fi
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Set versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Build signed AAB — Final Release
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "AAB build attempt $attempt/3"
            if ./gradlew bundleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed; waiting before retry..."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build signed APK — Final Release
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt/3"
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed; waiting before retry..."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Cleanup sensitive files
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - name: Verify and copy artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          cp android/app/build/outputs/bundle/release/*.aab "dist-artifacts/MediReminder-$VERSION-final.aab"
          cp android/app/build/outputs/apk/release/*release.apk "dist-artifacts/MediReminder-$VERSION-final.apk"
          ls -lh dist-artifacts dist-artifacts/signing-key 2>/dev/null || true
          echo "Final release artifacts ready: v$VERSION"

      - name: Upload installable release artifacts — Final Release
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-Final-${{ steps.version.outputs.version }}
          path: |
            dist-artifacts/MediReminder-${{ steps.version.outputs.version }}-final.aab
            dist-artifacts/MediReminder-${{ steps.version.outputs.version }}-final.apk
          if-no-files-found: error
          retention-days: 30


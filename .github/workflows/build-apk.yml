name: Build Signed APK (No local tools needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: نصب وابستگی‌ها و ساخت برنامهٔ وب
        run: |
          npm install
          npm run build

      - name: تنظیم Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب build-tools نسخه 34
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: افزودن پلتفرم Android
        run: npx cap add android

      - name: بررسی وجود فایل صدای آلارم
        run: |
          if [ ! -f "src/main/res/raw/medication_alarm.wav" ]; then
            echo "❌ File src/main/res/raw/medication_alarm.wav not found"
            exit 1
          fi
          echo "✅ Alarm sound file exists"

      - name: کپی فایل صوتی به مسیر منابع اندروید
        run: |
          mkdir -p android/app/src/main/res/raw
          cp src/main/res/raw/medication_alarm.wav android/app/src/main/res/raw/medication_alarm.wav
          echo "✅ Sound file copied successfully"
          ls -la android/app/src/main/res/raw/

      - name: اضافه کردن مجوزهای لازم به AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />|' "$MANIFEST"
          fi

          echo "✅ AndroidManifest.xml updated"

      - name: تولید و جایگذاری آیکون‌های نیتیو برنامه
        run: |
          if [ ! -f "public/icon-512.png" ]; then
            echo "❌ public/icon-512.png not found"
            exit 1
          fi

          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/icon-only.png
          npx @capacitor/assets generate --android

      - name: همگام‌سازی پروژه Capacitor
        run: npx cap sync android

      - name: تنظیم versionName و versionCode برای انتشار در بازار
        run: |
          BUILD_GRADLE="android/app/build.gradle"

          if [ ! -f "$BUILD_GRADLE" ]; then
            echo "❌ android/app/build.gradle not found"
            exit 1
          fi

          # versionName از package.json (1.0.1) و versionCode عددی افزایشی برای Play Store
          sed -i 's/versionCode [0-9]\+/versionCode 2/' "$BUILD_GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/' "$BUILD_GRADLE"

          echo "✅ Version set to 1.0.1 (versionCode 2)"
          grep -E 'versionCode|versionName' "$BUILD_GRADLE" || true

      - name: ساخت کی‌استور موقت برای امضا
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=MediReminder, OU=Dev, O=Charity, L=City, S=State, C=IR"

      - name: ساخت APK بدون امضا
        run: cd android && ./gradlew assembleRelease

      - name: امضای APK با apksigner
        run: |
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "❌ Unsigned APK not found"
            exit 1
          fi

          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --ks-key-alias upload \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "✅ APK signed successfully"

      - name: بررسی وجود APK نهایی
        run: |
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "❌ Final APK not found"
            exit 1
          fi
          echo "✅ Final APK exists"

      - name: آپلود APK نهایی
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: آپلود فایل کی‌استور
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore

name: Build MediReminder Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Capacitor Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
            'android.permission.SCHEDULE_EXACT_ALARM',
            'android.permission.RECEIVE_BOOT_COMPLETED',
            'android.permission.WAKE_LOCK',
          ]
          for perm in perms:
              line = f'    <uses-permission android:name="{perm}" />'
              if perm not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Detect release signing configuration
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$ALIAS" ] && [ -n "$KP" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "$KS" | base64 --decode > android/release.keystore
            cat > android/keystore.properties <<EOF2
          storeFile=release.keystore
          storePassword=$KSP
          keyAlias=$ALIAS
          keyPassword=$KP
          EOF2
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing secrets are not configured; building a debug APK.'
          fi

      - name: Configure signing
        if: steps.signing.outputs.enabled == 'true'
        run: python3 scripts/add_signing.py

      - name: Set release version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode $((1000 + GITHUB_RUN_NUMBER)) /" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle

      - name: Build signed AAB
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify artifacts
        run: |
          mkdir -p dist-artifacts
          if [ "${{ steps.signing.outputs.enabled }}" = 'true' ]; then
            cp android/app/build/outputs/bundle/release/*.aab "dist-artifacts/MediReminder-${{ steps.version.outputs.version }}.aab"
            cp android/app/build/outputs/apk/release/*release.apk "dist-artifacts/MediReminder-${{ steps.version.outputs.version }}.apk"
          else
            cp android/app/build/outputs/apk/debug/*debug.apk "dist-artifacts/MediReminder-${{ steps.version.outputs.version }}-debug.apk"
          fi
          ls -lh dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-Android-${{ steps.version.outputs.version }}
          path: dist-artifacts/*

name: Build Signed AAB and APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 34
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Copy alarm sound
        run: |
          test -f src/main/res/raw/medication_alarm.wav
          mkdir -p android/app/src/main/res/raw
          cp src/main/res/raw/medication_alarm.wav android/app/src/main/res/raw/medication_alarm.wav

      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q POST_NOTIFICATIONS "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />|' "$MANIFEST"
          fi

      - name: Generate icons
        run: |
          test -f public/icon-512.png
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/icon-only.png
          npx @capacitor/assets generate --android || true

      - name: Capacitor sync
        run: npx cap sync android

      - name: Set version 1.0.1 code 2
        run: |
          BG=android/app/build.gradle
          test -f "$BG"
          sed -i 's/versionCode [0-9][0-9]*/versionCode 2/' "$BG"
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/' "$BG"
          grep -E 'versionCode|versionName' "$BG" || true

      - name: Prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using production keystore"
          else
            keytool -genkey -v -keystore release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MediReminder, OU=Dev, O=Charity, L=City, S=State, C=IR"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "Using temporary keystore"
          fi
          cp release.keystore android/release.keystore

      - name: Write keystore.properties
        run: |
          printf '%s\n' "storeFile=../release.keystore" "storePassword=${KEYSTORE_PASSWORD}" "keyAlias=${KEY_ALIAS}" "keyPassword=${KEY_PASSWORD}" > android/keystore.properties
          cat android/keystore.properties

      - name: Inject signingConfigs into build.gradle
        run: |
          python3 << 'ENDSCRIPT'
          import re
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()
          if "signingConfigs" in content:
              print("already has signingConfigs")
          else:
              block = (
                  "\n    signingConfigs {\n"
                  "        release {\n"
                  "            def ks = rootProject.file(\"keystore.properties\")\n"
                  "            if (ks.exists()) {\n"
                  "                def p = new Properties()\n"
                  "                p.load(new FileInputStream(ks))\n"
                  "                storeFile file(p[\"storeFile\"])\n"
                  "                storePassword p[\"storePassword\"]\n"
                  "                keyAlias p[\"keyAlias\"]\n"
                  "                keyPassword p[\"keyPassword\"]\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
              )
              content = re.sub(r"(android\s*\{)", r"\1" + block, content, count=1)
              if "signingConfig signingConfigs.release" not in content:
                  content = re.sub(
                      r"(buildTypes\s*\{\s*release\s*\{)",
                      r"\1\n            signingConfig signingConfigs.release",
                      content,
                      count=1,
                  )
              with open(path, "w") as f:
                  f.write(content)
              print("injected signingConfigs")
          ENDSCRIPT

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -1 || true)
          APK=$(find android/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | grep -v unsigned | head -1 || true)
          UNSIGNED=$(find android/app/build/outputs/apk -name "*unsigned*.apk" 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ]; then cp "$AAB" dist-artifacts/MediReminder-1.0.1.aab; fi
          if [ -n "$APK" ]; then
            cp "$APK" dist-artifacts/MediReminder-1.0.1.apk
          elif [ -n "$UNSIGNED" ]; then
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass "pass:${KEYSTORE_PASSWORD}" --ks-key-alias "${KEY_ALIAS}" --key-pass "pass:${KEY_PASSWORD}" --out dist-artifacts/MediReminder-1.0.1.apk "$UNSIGNED"
          fi
          ls -la dist-artifacts/ || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-AAB-1.0.1
          path: dist-artifacts/MediReminder-1.0.1.aab
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK-1.0.1
          path: dist-artifacts/MediReminder-1.0.1.apk
          if-no-files-found: warn

name: Build Signed APK (No local tools needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ساخت برنامهٔ وب (Vite)
        run: |
          npm ci
          npm run build

      - name: نصب Capacitor نسخه ۵
        run: npm install @capacitor/android@5 @capacitor/core@5 @capacitor/cli@5 @capacitor/assets --no-save

      - name: تنظیم Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب build-tools نسخه ۳۴
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      - name: افزودن پلتفرم Android
        run: |
          npx cap add android

      - name: تولید و جایگذاری آیکون‌های نیتیو برنامه
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/icon-only.png
          npx @capacitor/assets generate --android

      - name: همگام‌سازی پروژه
        run: |
          npx cap sync

      - name: ساخت یک کی‌استور موقت (برای امضا)
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=MediReminder, OU=Dev, O=Charity, L=City, S=State, C=IR"

      - name: ساخت APK بدون امضا
        run: |
          cd android
          ./gradlew assembleRelease

      - name: امضای APK با apksigner (نسخه ۳۴.۰.۰)
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --ks-key-alias upload \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: آپلود APK نهایی (برای دانلود)
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: آپلود فایل کی‌استور (اختیاری)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore

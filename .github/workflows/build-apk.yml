name: Build Signed AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Secrets required for production Play Store signing:
#   ANDROID_KEYSTORE_BASE64  – base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# If any secret is missing, a temporary keystore is generated (debug/testing only).

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: نصب وابستگی‌ها و ساخت برنامهٔ وب
        run: |
          npm install
          npm run build

      - name: تنظیم Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب build-tools نسخه 34
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: افزودن پلتفرم Android
        run: npx cap add android

      - name: بررسی وجود فایل صدای آلارم
        run: |
          if [ ! -f "src/main/res/raw/medication_alarm.wav" ]; then
            echo "❌ File src/main/res/raw/medication_alarm.wav not found"
            exit 1
          fi
          echo "✅ Alarm sound file exists"

      - name: کپی فایل صوتی به مسیر منابع اندروید
        run: |
          mkdir -p android/app/src/main/res/raw
          cp src/main/res/raw/medication_alarm.wav android/app/src/main/res/raw/medication_alarm.wav
          echo "✅ Sound file copied successfully"

      - name: اضافه کردن مجوزهای لازم به AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />|' "$MANIFEST"
          fi
          echo "✅ AndroidManifest.xml updated"

      - name: تولید و جایگذاری آیکون‌های نیتیو برنامه
        run: |
          if [ ! -f "public/icon-512.png" ]; then
            echo "❌ public/icon-512.png not found"
            exit 1
          fi
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/icon-only.png
          npx @capacitor/assets generate --android

      - name: همگام‌سازی پروژه Capacitor
        run: npx cap sync android

      - name: تنظیم versionName و versionCode
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ ! -f "$BUILD_GRADLE" ]; then
            echo "❌ android/app/build.gradle not found"
            exit 1
          fi
          sed -i 's/versionCode [0-9]\+/versionCode 2/' "$BUILD_GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/' "$BUILD_GRADLE"
          echo "✅ Version set to 1.0.1 (versionCode 2)"
          grep -E 'versionCode|versionName' "$BUILD_GRADLE" || true

      - name: آماده‌سازی کی‌استور (از Secrets یا موقت)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
            echo "USING_PRODUCTION_KEYSTORE=true" >> $GITHUB_ENV
            echo "✅ Using production keystore from GitHub Secrets"
          else
            echo "⚠️ Production secrets not set — generating temporary keystore (NOT for Play Store)"
            keytool -genkey -v \
              -keystore release.keystore \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=MediReminder, OU=Dev, O=Charity, L=City, S=State, C=IR"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "USING_PRODUCTION_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: تزریق signingConfig به build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          # Create keystore.properties for Gradle
          cat > android/keystore.properties << EOF
storeFile=../release.keystore
storePassword=${KEYSTORE_PASSWORD}
keyAlias=${KEY_ALIAS}
keyPassword=${KEY_PASSWORD}
EOF

          # Inject signingConfigs and release signing before android { closes
          # Capacitor generates a standard structure; we append signing block
          if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            # Add signingConfigs after android {
            python3 << 'PY'
import re, os
path = "android/app/build.gradle"
with open(path) as f:
    content = f.read()

signing_block = '''
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
'''

            # Insert after "android {"
            content = re.sub(
                r'(android\s*\{)',
                r'\1' + signing_block,
                content,
                count=1
            )

            # Ensure release buildType uses signingConfig
            if "signingConfig signingConfigs.release" not in content:
                content = re.sub(
                    r'(buildTypes\s*\{\s*release\s*\{)',
                    r'\1\n            signingConfig signingConfigs.release',
                    content,
                    count=1
                )

            with open(path, "w") as f:
                f.write(content)
            print("✅ signingConfigs injected")
else:
            print("ℹ️ signingConfigs already present")
PY
          fi

          # Move keystore next to android/ for relative path
          cp release.keystore android/release.keystore
          echo "✅ keystore.properties written"

      - name: ساخت AAB (Android App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease
          echo "✅ AAB build finished"
          find app/build/outputs -name "*.aab" -ls || true

      - name: ساخت APK (برای تست مستقیم)
        run: |
          cd android
          ./gradlew assembleRelease
          echo "✅ APK build finished"
          find app/build/outputs -name "*.apk" -ls || true

      - name: پیدا کردن و امضای خروجی‌ها در صورت نیاز
        run: |
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
          APK=$(find android/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | grep -v unsigned | head -1)
          UNSIGNED_APK=$(find android/app/build/outputs/apk -name "*unsigned*.apk" 2>/dev/null | head -1)

          mkdir -p dist-artifacts

          if [ -n "$AAB" ]; then
            cp "$AAB" dist-artifacts/MediReminder-1.0.1.aab
            echo "✅ AAB: dist-artifacts/MediReminder-1.0.1.aab"
          else
            echo "⚠️ AAB not found"
          fi

          if [ -n "$APK" ]; then
            cp "$APK" dist-artifacts/MediReminder-1.0.1.apk
            echo "✅ APK: dist-artifacts/MediReminder-1.0.1.apk"
          elif [ -n "$UNSIGNED_APK" ]; then
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out dist-artifacts/MediReminder-1.0.1.apk \
              "$UNSIGNED_APK"
            echo "✅ APK signed manually"
          else
            echo "⚠️ APK not found"
          fi

          ls -la dist-artifacts/ || true

      - name: آپلود AAB
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-AAB-1.0.1
          path: dist-artifacts/MediReminder-1.0.1.aab
          if-no-files-found: warn

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: MediReminder-APK-1.0.1
          path: dist-artifacts/MediReminder-1.0.1.apk
          if-no-files-found: warn

      - name: خلاصه ساخت
        run: |
          echo "========================================"
          echo "Version: 1.0.1 (versionCode 2)"
          if [ "${USING_PRODUCTION_KEYSTORE}" = "true" ]; then
            echo "Signing: PRODUCTION keystore (from Secrets)"
          else
            echo "Signing: TEMPORARY keystore — set Secrets for Play Store"
          fi
          echo "Artifacts: AAB + APK under Actions → Artifacts"
          echo "========================================"

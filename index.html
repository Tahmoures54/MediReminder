<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>MediReminder</title>
    
    <!-- آیکون مرورگر (تب و بوکمارک) - نسخه قرمز -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- آیکون iOS (صفحه خانه و اسپلش) - باید 180x180 باشد -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- مانیفست PWA (آیکون‌های اندروید و نصب) -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- رنگ نوار وضعیت (Status Bar) و تنظیمات iOS -->
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <meta name="description" content="Smart medication reminder and tracker" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
